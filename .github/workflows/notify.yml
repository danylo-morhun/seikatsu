# Backup push notifications scheduler. cron-job.org is the primary caller (every 15 min):
# GitHub throttles this schedule to every few hours (docs/ops/runbook.md). Each notifier checks
# the user's local time itself and the notification log stops a late or doubled run from
# sending twice.
name: Notify

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

concurrency:
  group: notify
  cancel-in-progress: false

permissions: {}

jobs:
  notify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Call /api/cron/notify
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          curl --fail-with-body --silent --show-error --max-time 120 \
            -H "Authorization: Bearer $CRON_SECRET" \
            https://seikatsu.danylomorhun.com/api/cron/notify
