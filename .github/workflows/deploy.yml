name: Deploy

# Production deploy in batches: once a night, whatever is on main since the live
# release, if CI passed on it. Urgent fix: run it by hand from the Actions tab.
# Migrations run only when packages/db/drizzle changed since the live release,
# and only after approval in the `production-migrations` environment.
# Builds run on the VPS (deploy/vps/sk-deploy) over SSH with a key that can
# only call sk-deploy; going live is a symlink switch + restart.

on:
  schedule:
    - cron: "0 2 * * *" # 03:00 Warsaw in winter, 04:00 in summer
  workflow_dispatch: {}

concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read
  actions: read

env:
  SITE_URL: https://seikatsu.danylomorhun.com
  VPS_KNOWN_HOSTS: ${{ vars.VPS_KNOWN_HOSTS }}
  # Pasted into each step that talks to the VPS (key comes from the step env)
  SSH_SETUP: |
    install -m700 -d ~/.ssh
    printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/id_ed25519 && chmod 600 ~/.ssh/id_ed25519
    printf '%s\n' "$VPS_KNOWN_HOSTS" > ~/.ssh/known_hosts

jobs:
  plan:
    name: Plan
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.target.outputs.sha }}
      deploy: ${{ steps.target.outputs.deploy }}
      migrations: ${{ steps.diff.outputs.migrations }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      # Night run: skip when main has nothing new or CI hasn't passed on it yet
      # (the next night picks it up). By hand: always deploy, but only a green commit.
      - name: Decide what to deploy
        id: target
        env:
          GH_TOKEN: ${{ github.token }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          ${{ env.SSH_SETUP }}
          sha=$(git rev-parse HEAD)
          live=$(ssh "${{ vars.VPS_HOST }}" revision || true)
          echo "Live release: ${live:-unknown}, main: $sha"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "live=$live" >> "$GITHUB_OUTPUT"
          if [ "$GITHUB_EVENT_NAME" = schedule ] && [ "$live" = "$sha" ]; then
            echo "Nothing new since the live release"
            echo "deploy=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          ci=$(gh run list -R "$GITHUB_REPOSITORY" -w CI -c "$sha" -e push -L 1 --json conclusion -q '.[0].conclusion // empty')
          if [ "$ci" != success ]; then
            echo "::warning::CI on $sha is '${ci:-not run}', not deploying"
            [ "$GITHUB_EVENT_NAME" = schedule ] || exit 1
            echo "deploy=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git log --oneline "${live:-HEAD~1}..HEAD" 2>/dev/null || true
          echo "deploy=true" >> "$GITHUB_OUTPUT"
      - name: Diff migrations against the live release
        id: diff
        if: steps.target.outputs.deploy == 'true'
        env:
          live: ${{ steps.target.outputs.live }}
        run: |
          if [ -z "$live" ] || ! git cat-file -e "$live^{commit}" 2>/dev/null; then
            echo "Live commit unknown here — treating migrations as pending"
            echo "migrations=true" >> "$GITHUB_OUTPUT"
          elif git diff --quiet "$live" HEAD -- packages/db/drizzle; then
            echo "migrations=false" >> "$GITHUB_OUTPUT"
          else
            git diff --name-only "$live" HEAD -- packages/db/drizzle
            echo "migrations=true" >> "$GITHUB_OUTPUT"
          fi

  migrate:
    name: Migrate production DB
    needs: plan
    if: needs.plan.outputs.migrations == 'true'
    runs-on: ubuntu-latest
    environment: production-migrations
    steps:
      - name: Build the release and migrate the DB on the VPS
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          ${{ env.SSH_SETUP }}
          ssh "${{ vars.VPS_HOST }}" migrate "${{ needs.plan.outputs.sha }}"

  deploy:
    name: Deploy to VPS
    needs: [plan, migrate]
    if: always() && needs.plan.outputs.deploy == 'true' && (needs.migrate.result == 'success' || needs.migrate.result == 'skipped')
    runs-on: ubuntu-latest
    environment:
      name: Production
      url: ${{ env.SITE_URL }}
    env:
      VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
    steps:
      - name: Build and go live
        run: |
          ${{ env.SSH_SETUP }}
          ssh "${{ vars.VPS_HOST }}" deploy "${{ needs.plan.outputs.sha }}"
      - name: Smoke test
        id: smoke
        run: |
          sleep 5
          fail=0
          # /kuroji without a session redirects to the sign-in page (curl -L follows it)
          for url in "$SITE_URL/" "$SITE_URL/privacy" "$SITE_URL/terms" \
                     "$SITE_URL/manifest.webmanifest" "$SITE_URL/api/auth/providers" \
                     "$SITE_URL/kuroji"; do
            code=$(curl -sL -o /dev/null -w "%{http_code}" "$url")
            echo "$code $url"
            [ "$code" = 200 ] || fail=1
          done
          exit $fail
      - name: Roll back on failed smoke test
        if: failure() && steps.smoke.outcome == 'failure'
        run: |
          ${{ env.SSH_SETUP }}
          ssh "${{ vars.VPS_HOST }}" rollback
