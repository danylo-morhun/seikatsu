name: Deploy

# Production deploy in batches: once a night, whatever is on main since the live
# deployment, if CI passed on it. Every deploy empties Vercel's ISR cache, so
# fewer deploys = fewer ISR writes. Urgent fix: run it by hand from the Actions tab.
# Migrations run only when packages/db/drizzle changed since the live deployment,
# and only after approval in the `production-migrations` environment.
# Builds run on Vercel with the project's own env; the job only triggers them.

on:
  schedule:
    - cron: "0 2 * * *" # 03:00 Warsaw in winter, 04:00 in summer
  workflow_dispatch: {}

concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read
  actions: read

env:
  VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
  VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}
  SITE_URL: https://seikatsu.danylomorhun.com

jobs:
  plan:
    name: Plan
    # Gated until Vercel git auto-deploy for main is switched off (vars.DEPLOY_ENABLED)
    if: vars.DEPLOY_ENABLED == 'true' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.target.outputs.sha }}
      deploy: ${{ steps.target.outputs.deploy }}
      migrations: ${{ steps.diff.outputs.migrations }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      # Night run: skip when main has nothing new or CI hasn't passed on it yet
      # (the next night picks it up). By hand: always deploy, but only a green commit.
      - name: Decide what to deploy
        id: target
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          GH_TOKEN: ${{ github.token }}
        run: |
          sha=$(git rev-parse HEAD)
          live=$(curl -fsS -H "Authorization: Bearer $VERCEL_TOKEN" \
            "https://api.vercel.com/v13/deployments/${SITE_URL#https://}?teamId=$VERCEL_ORG_ID" \
            | jq -r '.meta.githubCommitSha // .meta.gitCommitSha // empty')
          echo "Live deployment: ${live:-unknown}, main: $sha"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "live=$live" >> "$GITHUB_OUTPUT"
          if [ "$GITHUB_EVENT_NAME" = schedule ] && [ "$live" = "$sha" ]; then
            echo "Nothing new since the live deployment"
            echo "deploy=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          ci=$(gh run list -R "$GITHUB_REPOSITORY" -w CI -c "$sha" -e push -L 1 --json conclusion -q '.[0].conclusion // empty')
          if [ "$ci" != success ]; then
            echo "::warning::CI on $sha is '${ci:-not run}', not deploying"
            [ "$GITHUB_EVENT_NAME" = schedule ] || exit 1
            echo "deploy=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git log --oneline "${live:-HEAD~1}..HEAD" 2>/dev/null || true
          echo "deploy=true" >> "$GITHUB_OUTPUT"
      - name: Diff migrations against the live deployment
        id: diff
        if: steps.target.outputs.deploy == 'true'
        env:
          live: ${{ steps.target.outputs.live }}
        run: |
          if [ -z "$live" ] || ! git cat-file -e "$live^{commit}" 2>/dev/null; then
            echo "Live commit unknown here — treating migrations as pending"
            echo "migrations=true" >> "$GITHUB_OUTPUT"
          elif git diff --quiet "$live" HEAD -- packages/db/drizzle; then
            echo "migrations=false" >> "$GITHUB_OUTPUT"
          else
            git diff --name-only "$live" HEAD -- packages/db/drizzle
            echo "migrations=true" >> "$GITHUB_OUTPUT"
          fi

  migrate:
    name: Migrate production DB
    needs: plan
    if: needs.plan.outputs.migrations == 'true'
    runs-on: ubuntu-latest
    environment: production-migrations
    steps:
      - uses: actions/checkout@v7
        with: { ref: "${{ needs.plan.outputs.sha }}" }
      - uses: ./.github/actions/setup
      - run: pnpm -F @seikatsu/db db:migrate
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

  deploy:
    name: Deploy to Vercel
    needs: [plan, migrate]
    if: always() && needs.plan.outputs.deploy == 'true' && (needs.migrate.result == 'success' || needs.migrate.result == 'skipped')
    runs-on: ubuntu-latest
    environment:
      name: Production
      url: ${{ env.SITE_URL }}
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
    steps:
      - uses: actions/checkout@v7
        with: { ref: "${{ needs.plan.outputs.sha }}" }
      - name: Remember the live deployment
        id: previous
        run: |
          url=$(curl -fsS -H "Authorization: Bearer $VERCEL_TOKEN" \
            "https://api.vercel.com/v13/deployments/${SITE_URL#https://}?teamId=$VERCEL_ORG_ID" \
            | jq -r '.url // empty')
          echo "Live before deploy: ${url:-none}"
          echo "url=$url" >> "$GITHUB_OUTPUT"
      - name: Build and deploy on Vercel
        id: deploy
        run: |
          set -o pipefail
          VERCEL_GUIDANCE_DISABLED=1 npx -y vercel@65.9.0 deploy --prod --yes --token "$VERCEL_TOKEN" | tee "$RUNNER_TEMP/deploy.log"
          # stdout may still carry hints besides the URL — take the last deployment URL
          url=$(grep -oE 'https://[a-z0-9-]+\.vercel\.app' "$RUNNER_TEMP/deploy.log" | tail -1)
          [ -n "$url" ] || { echo "No deployment URL in vercel output"; exit 1; }
          echo "Deployed: $url"
          echo "url=$url" >> "$GITHUB_OUTPUT"
      # After a rollback Vercel stops auto-assigning production domains until a
      # deployment is promoted explicitly (promoting the current one is a 409).
      - name: Promote to production domains
        env:
          DEPLOY_URL: ${{ steps.deploy.outputs.url }}
        run: |
          live=$(curl -fsS -H "Authorization: Bearer $VERCEL_TOKEN" \
            "https://api.vercel.com/v13/deployments/${SITE_URL#https://}?teamId=$VERCEL_ORG_ID" \
            | jq -r '.url // empty')
          if [ "https://$live" = "$DEPLOY_URL" ]; then
            echo "Domains already on the new deployment"
          else
            echo "Domains on ${live:-none} — promoting"
            npx -y vercel@65.9.0 promote "$DEPLOY_URL" --yes --token "$VERCEL_TOKEN"
          fi
      - name: Smoke test
        id: smoke
        run: |
          sleep 10
          fail=0
          # /kuroji without a session redirects to the sign-in page (curl -L follows it)
          for url in "$SITE_URL/" "$SITE_URL/privacy" "$SITE_URL/terms" \
                     "$SITE_URL/manifest.webmanifest" "$SITE_URL/api/auth/providers" \
                     "$SITE_URL/kuroji"; do
            code=$(curl -sL -o /dev/null -w "%{http_code}" "$url")
            echo "$code $url"
            [ "$code" = 200 ] || fail=1
          done
          exit $fail
      - name: Roll back on failed smoke test
        if: failure() && steps.smoke.outcome == 'failure' && steps.previous.outputs.url != ''
        run: npx -y vercel@65.9.0 rollback "${{ steps.previous.outputs.url }}" --yes --token "$VERCEL_TOKEN"
