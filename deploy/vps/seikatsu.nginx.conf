# /etc/nginx/sites-enabled/seikatsu. TLS cert from certbot (webroot /var/www/acme).
# Shared upstream and rate limit zone: seikatsu.nginx-common.conf -> /etc/nginx/conf.d/20-seikatsu.conf
server {
    listen 80;
    server_name seikatsu.danylomorhun.com;
    include snippets/acme.conf;
    location / { return 308 https://seikatsu.danylomorhun.com$request_uri; }
}

server {
    listen 443 ssl http2;
    server_name seikatsu.danylomorhun.com;
    ssl_certificate /etc/letsencrypt/live/seikatsu/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/seikatsu/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_timeout 1d;
    ssl_session_tickets off;
    add_header Strict-Transport-Security "max-age=31536000" always;

    # Hashed assets of every recent release (sk-deploy keeps them in shared/static)
    location ^~ /_next/static/ {
        alias /srv/seikatsu/shared/static/;
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
        try_files $uri =404;
    }
    location ^~ /api/auth/ {
        limit_req zone=sk_auth burst=10 nodelay;
        limit_req_status 429;
        include snippets/wellbotany-proxy.conf;
        proxy_pass http://seikatsu_app;
    }
    location / {
        include snippets/wellbotany-proxy.conf;
        proxy_pass http://seikatsu_app;
    }
}
