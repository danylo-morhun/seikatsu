name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Every route is dynamic, so the build never queries Postgres — a placeholder URL is enough.
  # Unit tests run against in-process PGlite (packages/db/src/test-utils.ts).
  DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/seikatsu_ci"
  AUTH_SECRET: "ci-test-auth-secret-32-chars-long-seikatsu"
  AUTH_URL: "http://localhost:3010"
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  lint-and-typecheck:
    name: Code Quality & Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - run: pnpm exec biome check .
      - run: pnpm typecheck

  unit-test:
    name: Unit Tests (Vitest)
    needs: lint-and-typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - run: pnpm test

  build:
    name: Production Build Verification
    needs: lint-and-typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - run: pnpm build
