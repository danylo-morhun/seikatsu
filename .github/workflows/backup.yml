name: Backup

# Nightly dump of the production DB, encrypted with age (public key in vars.BACKUP_AGE_RECIPIENT),
# kept as an artifact for 90 days. Each run restores the dump into a throwaway Postgres
# to prove it is usable. Restore by hand: docs/ops/runbook.md → "Restore from backup".

on:
  schedule:
    - cron: "30 1 * * *"
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  backup:
    name: Dump, verify, store
    runs-on: ubuntu-latest
    environment: backups
    services:
      restore:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: restore
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - name: Dump production
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          docker run --rm -e DATABASE_URL postgres:17 \
            pg_dump --format=custom --no-owner --no-privileges "$DATABASE_URL" > db.dump
          ls -lh db.dump

      - name: Verify restore
        run: |
          docker run --rm --network host -v "$PWD:/w" postgres:17 \
            pg_restore --no-owner --no-privileges --exit-on-error \
            -d postgresql://postgres:postgres@localhost:5432/restore /w/db.dump
          rows=$(docker run --rm --network host postgres:17 psql -tA \
            postgresql://postgres:postgres@localhost:5432/restore \
            -c "select count(*) from transactions")
          echo "Restored transactions: $rows"
          [ "$rows" -gt 0 ]

      - name: Encrypt
        env:
          RECIPIENT: ${{ vars.BACKUP_AGE_RECIPIENT }}
        run: |
          sudo apt-get install -y -qq age >/dev/null
          age -r "$RECIPIENT" -o "seikatsu-$(date -u +%F).dump.age" db.dump
          shred -u db.dump

      - uses: actions/upload-artifact@v6
        with:
          name: db-${{ github.run_id }}
          path: seikatsu-*.dump.age
          retention-days: 90
          compression-level: 0
